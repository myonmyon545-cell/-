name: Care handoff checks
on:
  push:
    branches: [main]
    paths:
      - 'care-insurance-analysis/**'
      - '.github/workflows/care-handoff-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the fixed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Boundary and regression tests
        run: python3 -m unittest discover -s care-insurance-analysis/tools -p 'test_*.py' -v
      - name: Validate handoff and any supplied candidate metrics
        run: python3 care-insurance-analysis/tools/verify_handoff.py
